[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seekr"
version = "0.1.0"
description = "A web search engine built from scratch: crawler, index, ranking, spell-correct, autocomplete, vector search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "numpy>=1.26", "snowballstemmer>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "networkx>=3.2", "scipy>=1.11"]  # reference implementations for tests

[project.scripts]
seekr = "seekr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
